# Curated Venue Database — Sharing & Publication Module
#
# Venues not discoverable via APIs (student journals, preprint servers,
# citizen science platforms, science art competitions, etc.).
# See docs/philosophy/sharing-and-publication.md for rationale.
#
# Fields:
#   name              — Display name
#   url               — Primary URL
#   type              — journal | magazine | preprint | presentation | popular_media |
#                       digital | citizen_science | scicomm_program | science_art
#   age_range         — [min_age, max_age] inclusive
#   education_level   — ["middle_school", "high_school", "university", "any"]
#   fields            — ["natural_science", "social_science"] or ["all"]
#   review_type       — "faculty" | "graduate_student" | "teen_peer" | "editorial" | "none"
#   cost              — "free" | "low" | "moderate" (submission + publication combined)
#   quality_tier      — "selective" | "moderate" | "open"
#   format            — "paper" | "poster" | "oral" | "video" | "blog" | "visual_art" |
#                       "photography" | "music" | "data_contribution" | "multiple"
#   requires_mentor   — true/false
#   is_isef_affiliated — true/false (ISEF-affiliated venues are always filtered out)
#   vanity_press_risk — true/false
#   active            — true/false (soft-delete)
#   notes             — Free text context for LLM reasoning

