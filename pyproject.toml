[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "research-mentor"
version = "1.0.5"
description = "AI-powered research mentor that guides you through your research journey."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Sergey Samsonau" },
    { name = "Olga Vine" },
]
maintainers = [
    { name = "Authentic Research Partners LLC", email = "info@arpconnect.com" },
]
keywords = [
    "research",
    "mentoring",
    "education",
    "citizen-science",
    "amateur-science",
    "research-methods",
    "learning",
    "tutoring",
    "academic-research",
    "stem-education",
    "self-directed-learning",
    "vllm",
    "gemma",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "click>=8.0.0",
    "loguru>=0.7.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.10.0",
    "httpx>=0.27.0",
    "langchain-core>=1.3.3",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "openai>=2.0.0",
    "aiosqlite>=0.20.0",
    "aiosqlitepool>=1.0.0",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=4.0.0",
    "arxiv>=2.1.0",
    "python-multipart>=0.0.27",
    "pyyaml>=6.0",
    "pdfplumber>=0.10.0",
    "defusedxml>=0.7.0",
    "python-docx>=1.0.0",
    "pandas>=2.2.0",
    "tomli_w>=1.0.0",
    "tavily-python>=0.7.0",
    "tenacity>=9.0.0",
    "tabulate>=0.9.0",
    "statsmodels>=0.14.0",
    "idna>=3.15",
    "langsmith>=0.8.0",
    "lxml>=6.1.0",
    "starlette>=1.0.1",
    "urllib3>=2.7.0",
]

[project.license]
text = "PolyForm Noncommercial 1.0.0"

[project.urls]
Homepage = "https://researchmentor.ai"
Repository = "https://github.com/authentic-research-partners/research-mentor"
Documentation = "https://github.com/authentic-research-partners/research-mentor#readme"
Issues = "https://github.com/authentic-research-partners/research-mentor/issues"

[project.scripts]
research-mentor = "research_mentor.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
    "src/research_mentor",
]
artifacts = [
    "src/research_mentor/ui_static/**",
    "src/research_mentor/config.toml",
    "src/research_mentor/agents/**",
]
